# Configuration variable chargee depuis un fichier externe au JAR.
spring.config.import=optional:file:${ENV_FILE:.env}[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.application.name=authorization-server
server.servlet.context-path=/authorization-server
server.port=${OAUTH_PORT}
oauth2.desktop.clientid=${OAUTH2_DESKTOP_CLIENTID}
oauth2.desktop.clientsecret=${OAUTH2_DESKTOP_CLIENTSECRET}
oauth2.desktop.accesstoken.validity=${OAUTH2_DESKTOP_ACCESSTOKEN_VALIDITY}
oauth2.desktop.refreshtoken.validity=${OAUTH2_DESKTOP_REFRESHTOKEN_VALIDITY}
oauth2.ress-adh.clientid=${AUTHORIZATION_SERVER_OAUTH2_RESS_ADH_CLIENTID}
oauth2.ress-adh.clientsecret=${AUTHORIZATION_SERVER_OAUTH2_RESS_ADH_CLIENTSECRET}
oauth2.ress-adh.accesstoken.validity=${OAUTH2_RESS_ADH_ACCESSTOKEN_VALIDITY}
oauth2.ress-adh.refreshtoken.validity=${OAUTH2_RESS_ADH_REFRESHTOKEN_VALIDITY}
jks.keystore=${JKS_KEYSTORE}
jks.keypass=${JKS_KEYPASS}
jks.alias=${JKS_ALIAS}
jdbc.driverClassName=org.postgresql.Driver
jdbc.url=${JDBC_URL}
jdbc.user=${JDBC_USER}
jdbc.pass=${JDBC_PASS}
oauth2.issuer=${OAUTH2_ISSUER}

# Configuration Logback commune externe au JAR.
logging.config=${LOGGING_CONFIG:file:logback.xml}
