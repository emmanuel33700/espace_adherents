# Configuration variable chargee depuis un fichier externe au JAR.
spring.config.import=optional:file:${ENV_FILE:.env}[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.servlet.context-path=/resource-authorization
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.port=${AUTHORIZATION_PORT}
logging.level.org=${LOGGING_LEVEL_ORG}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${AUTHORIZATION_SPRING_DATASOURCE_URL}
spring.datasource.username=${AUTHORIZATION_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${AUTHORIZATION_SPRING_DATASOURCE_PASSWORD}
key.public=${KEY_PUBLIC}
mailjet.login=${MAILJET_LOGIN}
mailjet.password=${MAILJET_PASSWORD}
message.from.mail=${MESSAGE_FROM_MAIL}
message.from.name=${MESSAGE_FROM_NAME}
message.to.mail=${MESSAGE_TO_MAIL}
message.to.name=${MESSAGE_TO_NAME}
message.template.code.confirmationadhesion=${MESSAGE_TEMPLATE_CODE_CONFIRMATIONADHESION}
message.template.code.validationmail=${MESSAGE_TEMPLATE_CODE_VALIDATIONMAIL}
oauth2.ress-adh.clientid=${AUTHORIZATION_OAUTH2_RESS_ADH_CLIENTID}
oauth2.ress-adh.clientsecret=${AUTHORIZATION_OAUTH2_RESS_ADH_CLIENTSECRET}
oauth2.url=${AUTHORIZATION_OAUTH2_URL}
validation.password.id=${VALIDATION_PASSWORD_ID}
message.template.code.reint_password=${MESSAGE_TEMPLATE_CODE_REINT_PASSWORD}
validationmail.url=${AUTHORIZATION_VALIDATIONMAIL_URL}
validation.password.url=${VALIDATION_PASSWORD_URL}
api.ress.adherents.url=${API_RESS_ADHERENTS_URL}
message.dev=${MESSAGE_DEV:false}
