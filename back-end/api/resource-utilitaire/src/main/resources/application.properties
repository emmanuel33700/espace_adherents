# Configuration variable chargee depuis un fichier externe au JAR.
spring.config.import=optional:file:${ENV_FILE:.env}[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.servlet.context-path=/resource-utilitaire
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.port=${UTILITAIRE_PORT}
logging.level.org=${LOGGING_LEVEL_ORG}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${UTILITAIRE_SPRING_DATASOURCE_URL}
spring.datasource.username=${UTILITAIRE_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${UTILITAIRE_SPRING_DATASOURCE_PASSWORD}
key.public=${KEY_PUBLIC}
mailjet.login=${MAILJET_LOGIN}
mailjet.password=${MAILJET_PASSWORD}
message.from.mail=${MESSAGE_FROM_MAIL}
message.from.name=${MESSAGE_FROM_NAME}
message.to.mail=${MESSAGE_TO_MAIL}
message.to.name=${MESSAGE_TO_NAME}
message.template.code.preinscription=${UTILITAIRE_MESSAGE_TEMPLATE_CODE_PREINSCRIPTION}
message.template.code.evenement.ajoute=${MESSAGE_TEMPLATE_CODE_EVENEMENT_AJOUTE}
message.evenement.ajoute.id=${MESSAGE_EVENEMENT_AJOUTE_ID}
validationmail.url=${UTILITAIRE_VALIDATIONMAIL_URL}
confirmparticipationevenement.url=${CONFIRMPARTICIPATIONEVENEMENT_URL}
folder.path.document=${FOLDER_PATH_DOCUMENT}
message.dev=${MESSAGE_DEV:false}
