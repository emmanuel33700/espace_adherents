# Configuration variable chargee depuis un fichier externe au JAR.
spring.config.import=optional:file:${ENV_FILE:.env}[.properties]
spring.application.name=resource-adherents
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.servlet.context-path=/resource-adherents
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.port=${ADHERENTS_PORT}
logging.level.org=${LOGGING_LEVEL_ORG}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${ADHERENTS_SPRING_DATASOURCE_URL}
spring.datasource.username=${ADHERENTS_SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${ADHERENTS_SPRING_DATASOURCE_PASSWORD}
key.public=${KEY_PUBLIC}
mailjet.login=${MAILJET_LOGIN}
mailjet.password=${MAILJET_PASSWORD}
message.from.mail=${MESSAGE_FROM_MAIL}
message.from.name=${MESSAGE_FROM_NAME}
message.to.mail=${MESSAGE_TO_MAIL}
message.to.name=${MESSAGE_TO_NAME}
message.template.code.preinscription=${ADHERENTS_MESSAGE_TEMPLATE_CODE_PREINSCRIPTION}
message.preinscription.id=${MESSAGE_PREINSCRIPTION_ID}
validationmail.url=${ADHERENTS_VALIDATIONMAIL_URL}
oauth2.ress-adh.clientid=${ADHERENTS_OAUTH2_RESS_ADH_CLIENTID}
oauth2.ress-adh.clientsecret=${ADHERENTS_OAUTH2_RESS_ADH_CLIENTSECRET}
oauth2.ress-adh.accesstoken.validity=${OAUTH2_RESS_ADH_ACCESSTOKEN_VALIDITY}
oauth2.ress-adh.refreshtoken.validity=${OAUTH2_RESS_ADH_REFRESHTOKEN_VALIDITY}
oauth2.url=${ADHERENTS_OAUTH2_URL}
api.ress.authorization.url=${API_RESS_AUTHORIZATION_URL}
api.ress.authorization.put.url=${API_RESS_AUTHORIZATION_PUT_URL}
api.ress.authorization.activation.url=${API_RESS_AUTHORIZATION_ACTIVATION_URL}
folder.path.photo.profil=${FOLDER_PATH_PHOTO_PROFIL}
message.dev=${MESSAGE_DEV:false}

# Configuration Logback commune externe au JAR.
logging.config=${LOGGING_CONFIG:file:logback.xml}
